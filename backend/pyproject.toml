[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "pdf: Playwright(Chromium) 실제 렌더링 테스트 — 무거우므로 기본에서 분리(스킵 가능)",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008: FastAPI 의 Depends()/Query() 기본값 패턴은 관용적이므로 허용.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# llm.py 프롬프트는 AI팀 원본(v1.2)을 한 글자도 바꾸지 않고 이식 — 한글 장문이라 E501 불가피.
"app/services/llm.py" = ["E501"]
