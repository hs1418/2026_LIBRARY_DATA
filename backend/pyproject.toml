[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "pdf: Playwright(Chromium) 실제 렌더링 테스트 — 무거우므로 기본에서 분리(스킵 가능)",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008: FastAPI 의 Depends()/Query() 기본값 패턴은 관용적이므로 허용.
ignore = ["B008"]
